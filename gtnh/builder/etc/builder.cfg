-- builder.cfg — Optional overrides for build.lua.
-- Every value set here REPLACES build.lua's default, so keep the same shape
-- as the default when changing something.
return {
  -- Fuel: item registry name -> energy per item (burn ticks x 0.8).
  -- A plain "name" matches every damage value: charcoal is "minecraft:coal"
  -- with damage 1, so it counts as fuel too. Use "name@damage" when one name
  -- covers several items, like GregTech's gem blocks (run fueltest to see keys).
  fuelItems = {
    ["minecraft:coal"] = 1280,
    ["minecraft:coal_block"] = 12800,
    ["gregtech:gt.blockgem3@4"] = 12800,  -- Block of Charcoal
  },
  fuelReserve = 16,               -- fuel items to keep aboard

  restBelow = 0.30,               -- rest when energy falls below 30%
  resumeAbove = 0.90,             -- resume once energy is back above 90%
  shutdownBelow = 0.05,           -- save and power off below 5%
  restockRetrySeconds = 60,       -- how often to re-check an empty chest

  broadcastPort = 5656,           -- 1..65535
  broadcastInterval = 10,

  -- Keep this path: builds and excavations already running saved progress here.
  stateFile = "/build_state.json",
}
