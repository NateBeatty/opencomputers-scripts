-- builder.cfg — Default configuration for the OpenComputers builder.
-- All values can be overridden by modifying this file.
-- The file is loaded as a Lua table.

return {
  -- Energy management
  fuelReserve = 16,               -- Number of fuel items to keep in inventory
  restBelow = 0.3,                -- Fraction of max energy to start resting (0.3 = 30%)
  resumeAbove = 0.9,              -- Fraction of max energy to resume from rest (0.9 = 90%)
  shutdownBelow = 0.05,           -- Fraction of max energy before shutdown (0.05 = 5%)

  -- Restocking
  restockRetrySeconds = 60,       -- How often to check for materials while waiting (seconds)

  -- Fuel
  fuelItems = { "coal" },         -- Priority order for fuel (first is primary)
  fuelEnergy = {
    coal = 1280,                  -- Energy per coal (1600 ticks at 0.8/tick)
    -- Add other fuel types here if used
  },

  -- Broadcasting
  broadcastPort = 65656,          -- Wireless port for status broadcasts
  broadcastInterval = 10,         -- Seconds between broadcasts while building

  -- State file
  stateFile = "/build_state.json", -- Where to save resume state

  -- Control
  controlAddress = nil,           -- Address to accept commands from (nil = anyone)
  modemStrength = 2,              -- Modem strength for commands (T2 = 2)
}
